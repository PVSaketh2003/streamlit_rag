name: Janani CI/CD

on:
  push:
    branches: ["**"]
    paths: ["janani/**", ".github/workflows/janani-ci-cd.yml"]
  pull_request:
    paths: ["janani/**", ".github/workflows/janani-ci-cd.yml"]
  workflow_dispatch:

concurrency:
  group: janani-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · Django tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: janani
          POSTGRES_PASSWORD: janani
          POSTGRES_DB: janani
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U janani" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_TESTING: "1"
      POSTGRES_DB: janani
      POSTGRES_USER: janani
      POSTGRES_PASSWORD: janani
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    defaults:
      run:
        working-directory: janani/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: janani/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          # test-only: lets the suite prove our FAISS/MMR matches LangChain's exactly
          pip install "langchain-community>=0.3,<0.5"
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Django system checks
        run: python manage.py check
      - name: Run tests
        run: python manage.py test studio -v 2

  frontend:
    name: Frontend · unit tests + production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: janani/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: janani/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: janani/frontend/dist
          retention-days: 7

  deploy:
    name: Deploy · Vercel production (janani.pvsairamsaketh.in)
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://janani.pvsairamsaketh.in
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PUBLIC_URL: https://janani.pvsairamsaketh.in
    defaults:
      run:
        working-directory: janani
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment secrets
        id: secrets
        run: |
          missing=""
          for s in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID DATABASE_URL; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these GitHub repository secrets:$missing (see janani/README.md → Deploy)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: janani/requirements.txt

      - name: Apply database migrations (Neon)
        working-directory: janani/backend
        run: |
          pip install -r ../requirements.txt
          python manage.py migrate --noinput

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build (frontend + Python API)
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test (health + database)
        run: |
          check() {  # $1 = base url, $2 = fatal|soft
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 "$1/api/health/" || echo 000)
              if [ "$code" = 200 ] && grep -q '"database":true' /tmp/health.json; then
                echo "✅ $1/api/health/ → $(cat /tmp/health.json)" | tee -a "$GITHUB_STEP_SUMMARY"; return 0
              fi
              if [ "$code" = 401 ] && [ "$2" = fatal ]; then
                echo "::warning::$1 is behind Vercel Deployment Protection (401); checking the public domain instead."; return 0
              fi
              echo "waiting for $1 (HTTP $code, try $i)…"; sleep 10
            done
            if [ "$2" = fatal ]; then echo "::error::Health check failed for $1: HTTP $code $(cat /tmp/health.json 2>/dev/null)"; exit 1; fi
            echo "::warning::$1 is not answering yet — check the GoDaddy CNAME record and the domain in Vercel (see janani/README.md)."
          }
          check "${{ steps.deploy.outputs.url }}" fatal
          check "$PUBLIC_URL" soft
