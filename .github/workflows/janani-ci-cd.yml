name: Janani CI/CD

on:
  push:
    branches: ["**"]
    paths: ["janani/**", ".github/workflows/janani-ci-cd.yml"]
  pull_request:
    paths: ["janani/**", ".github/workflows/janani-ci-cd.yml"]
  workflow_dispatch:

concurrency:
  group: janani-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · Django tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: janani
          POSTGRES_PASSWORD: janani
          POSTGRES_DB: janani
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U janani" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_TESTING: "1"
      POSTGRES_DB: janani
      POSTGRES_USER: janani
      POSTGRES_PASSWORD: janani
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    defaults:
      run:
        working-directory: janani/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: janani/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          # test-only: lets the suite prove our FAISS/MMR matches LangChain's exactly
          pip install "langchain-community>=0.3,<0.5"
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Django system checks
        run: python manage.py check
      - name: Run tests
        run: python manage.py test studio -v 2

  frontend:
    name: Frontend · unit tests + production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: janani/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: janani/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: janani/frontend/dist
          retention-days: 7

  deploy:
    name: Deploy · Render (janani.pvsairamsaketh.in)
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://janani.pvsairamsaketh.in
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      # Render service URL (Settings → the service's .onrender.com address); repo variable, optional
      RENDER_URL: ${{ vars.RENDER_URL || 'https://janani.onrender.com' }}
      PUBLIC_URL: https://janani.pvsairamsaketh.in
    steps:
      - name: Check deployment secret
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error title=Missing secret::Add the RENDER_DEPLOY_HOOK_URL repository secret (Render → janani service → Settings → Deploy Hook). See janani/README.md."
            exit 1
          fi

      - name: Trigger Render deploy of this commit
        run: |
          code=$(curl -s -o /tmp/hook.json -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL?ref=$GITHUB_SHA")
          echo "Render deploy hook → HTTP $code $(cat /tmp/hook.json)"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || { echo "::error::Render rejected the deploy hook (HTTP $code)"; exit 1; }

      - name: Wait until the tested commit is live (health + database)
        run: |
          want="${GITHUB_SHA::7}"
          echo "Waiting for $RENDER_URL to report version $want …"
          for i in $(seq 1 100); do                       # up to ~25 min (build + free-tier cold start)
            body=$(curl -s --max-time 60 "$RENDER_URL/api/health/" || true)
            ver=$(echo "$body" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('version',''), d.get('database'))" 2>/dev/null || true)
            if [ "$ver" = "$want True" ]; then
              echo "✅ $RENDER_URL is live on $want with the database connected" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "[$i] live: ${ver:-unreachable}"; sleep 15
          done
          echo "::error::Render did not go live with $want in time — open the Render dashboard → janani → Events/Logs."
          exit 1

      - name: Check the custom domain
        run: |
          body=$(curl -s --max-time 60 "$PUBLIC_URL/api/health/" || true)
          if echo "$body" | grep -q "\"version\":\"${GITHUB_SHA::7}\""; then
            echo "✅ $PUBLIC_URL serves the new version" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::$PUBLIC_URL is not serving the new version yet — check the GoDaddy CNAME (janani → the .onrender.com host) and the domain status in Render."
          fi
